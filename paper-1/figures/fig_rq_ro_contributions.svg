<title>Research questions, objectives, and contributions for the M²Fabric thesis</title>
<desc>RQ1 maps to RO1 and RO2, producing C1. RQ2 maps to RO3, producing C2. RQ3 maps to RO4 and RO5, producing C3 and C4.</desc>
