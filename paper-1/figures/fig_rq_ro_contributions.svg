<rect x="18" y="10" width="142" height="22" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="89" y="21" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" font-weight="bold" fill="#444441">Research questions</text>
<rect x="270" y="10" width="190" height="22" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="365" y="21" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" font-weight="bold" fill="#444441">Research objectives</text>
<rect x="542" y="10" width="128" height="22" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="606" y="21" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" font-weight="bold" fill="#444441">Contributions</text>
<rect x="18" y="48" width="142" height="96" rx="7" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="89" y="78" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2C2C2A">RQ1</text>
<text x="89" y="90" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" font-weight="normal" fill="#0F6E56">Which components are</text>
<text x="89" y="102" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" font-weight="normal" fill="#0F6E56">quantum-vulnerable,</text>
<text x="89" y="114" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" font-weight="normal" fill="#0F6E56">and with what severity?</text>
<rect x="18" y="258" width="142" height="96" rx="7" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="89" y="288" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2C2C2A">RQ2</text>
<text x="89" y="300" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" font-weight="normal" fill="#534AB7">How can PQC be integrated</text>
<text x="89" y="312" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" font-weight="normal" fill="#534AB7">across all four layers,</text>
<text x="89" y="324" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" font-weight="normal" fill="#534AB7">preserving compatibility?</text>
<rect x="18" y="430" width="142" height="100" rx="7" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.8"/>
<text x="89" y="462" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2C2C2A">RQ3</text>
<text x="89" y="474" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" font-weight="normal" fill="#BA7517">What is the performance</text>
<text x="89" y="486" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" font-weight="normal" fill="#BA7517">cost of the complete</text>
<text x="89" y="498" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" font-weight="normal" fill="#BA7517">multilayer deployment?</text>
<rect x="270" y="48" width="190" height="72" rx="7" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="365" y="70" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2C2C2A">RO1 — Vulnerability audit</text>
<text x="365" y="84" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" font-weight="normal" fill="#0F6E56">Enumerate all 25 crypto ops;</text>
<text x="365" y="98" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" font-weight="normal" fill="#0F6E56">classify by quantum threat</text>
<rect x="270" y="134" width="190" height="86" rx="7" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="365" y="159" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2C2C2A">RO2 — Threat model</text>
<text x="365" y="171" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" font-weight="normal" fill="#0F6E56">5 threat scenarios, Mosca</text>
<text x="365" y="183" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" font-weight="normal" fill="#0F6E56">analysis, 8 formal</text>
<text x="365" y="195" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" font-weight="normal" fill="#0F6E56">integration requirements</text>
<rect x="270" y="256" width="190" height="100" rx="7" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="365" y="288" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2C2C2A">RO3 — Implementation</text>
<text x="365" y="300" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" font-weight="normal" fill="#534AB7">PQC-BCCSP, PQC Fabric CA,</text>
<text x="365" y="312" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" font-weight="normal" fill="#534AB7">buildPQCChain, hybrid TLS</text>
<text x="365" y="324" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" font-weight="normal" fill="#534AB7">~1,713 LoC (Table 5.2) · verified</text>
<rect x="270" y="382" width="190" height="72" rx="7" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.8"/>
<text x="365" y="404" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2C2C2A">RO4 — Empirical evaluation</text>
<text x="365" y="418" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" font-weight="normal" fill="#BA7517">60 runs · 3 configs · 3 algs</text>
<text x="365" y="432" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" font-weight="normal" fill="#BA7517">TPS, latency, storage</text>
<rect x="270" y="470" width="190" height="72" rx="7" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.8"/>
<text x="365" y="492" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2C2C2A">RO5 — Selection framework</text>
<text x="365" y="506" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" font-weight="normal" fill="#BA7517">Output-size principle;</text>
<text x="365" y="520" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" font-weight="normal" fill="#BA7517">algorithm decision guide</text>
<rect x="542" y="82" width="128" height="72" rx="7" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="606" y="109" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2C2C2A">C1</text>
<text x="606" y="127" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" font-weight="normal" fill="#0F6E56">Quantum threat taxonomy</text>
<rect x="542" y="276" width="128" height="72" rx="7" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="606" y="303" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2C2C2A">C2</text>
<text x="606" y="321" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" font-weight="normal" fill="#534AB7">Complete PQC architecture</text>
<rect x="542" y="390" width="128" height="72" rx="7" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.8"/>
<text x="606" y="417" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2C2C2A">C3</text>
<text x="606" y="435" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" font-weight="normal" fill="#BA7517">Per-layer empirical eval.</text>
<rect x="542" y="478" width="128" height="72" rx="7" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.8"/>
<text x="606" y="505" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2C2C2A">C4</text>
<text x="606" y="516" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" font-weight="normal" fill="#BA7517">Algorithm selection</text>
<text x="606" y="530" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" font-weight="normal" fill="#BA7517">framework</text>
