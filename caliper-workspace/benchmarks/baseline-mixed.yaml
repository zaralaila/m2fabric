test:
  name: fabric-baseline-ecdsa-mixed
  description: >
    Mixed workload baseline benchmark for Hyperledger Fabric v2.5.12
    using default ECDSA-P256 cryptography. 70% asset creation and 30%
    asset query. Establishes the classical mixed-workload performance
    reference for comparison against PQC algorithm configurations.
  workers:
    number: 4
  rounds:
    - label: mixed-25tps
      txDuration: 120
      rateControl:
        type: fixed-rate
        opts:
          tps: 25
      workload:
        module: workload/mixedAsset.js
        arguments:
          contractId: basic
    - label: mixed-50tps
      txDuration: 120
      rateControl:
        type: fixed-rate
        opts:
          tps: 50
      workload:
        module: workload/mixedAsset.js
        arguments:
          contractId: basic
    - label: mixed-100tps
      txDuration: 120
      rateControl:
        type: fixed-rate
        opts:
          tps: 100
      workload:
        module: workload/mixedAsset.js
        arguments:
          contractId: basic
    - label: mixed-150tps
      txDuration: 120
      rateControl:
        type: fixed-rate
        opts:
          tps: 150
      workload:
        module: workload/mixedAsset.js
        arguments:
          contractId: basic
    - label: mixed-200tps
      txDuration: 120
      rateControl:
