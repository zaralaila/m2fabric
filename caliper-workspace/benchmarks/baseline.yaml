test:
  name: fabric-baseline-ecdsa
  description: >
    Baseline benchmark for Hyperledger Fabric v2.5.12 using default
    ECDSA-P256 cryptography. Establishes the classical performance
    reference for comparison against PQC algorithm configurations.
  workers:
    number: 4
  rounds:
    - label: write-25tps
      txDuration: 120
      rateControl:
        type: fixed-rate
        opts:
          tps: 25
      workload:
        module: workload/createAsset.js
        arguments:
          contractId: basic
    - label: write-50tps
      txDuration: 120
      rateControl:
        type: fixed-rate
        opts:
          tps: 50
      workload:
        module: workload/createAsset.js
        arguments:
          contractId: basic
