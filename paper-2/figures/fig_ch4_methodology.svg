<svg width="100%" viewBox="0 0 680 460" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Four-stage quantum vulnerability audit methodology for Hyperledger Fabric v2.5.12</title>
<desc>Three-column layout. Left column lists scope exclusions and rejected frameworks. Centre column shows the four sequential audit stages from component enumeration through severity assessment. Right column shows the four-level severity scale used in Stage 4.</desc>

<defs>
  <marker id="arrow_m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Outer panel -->
<rect x="8" y="8" width="664" height="444" rx="10" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.6"/>

<!-- ===================== LEFT: Excluded scope ===================== -->
<rect x="20" y="30" width="180" height="178" rx="8" fill="#F4ECEC" stroke="#A32D2D" stroke-width="0.6"/>
<text x="110" y="50" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" font-weight="bold" fill="#A32D2D">Out of scope</text>
<line x1="32" y1="62" x2="188" y2="62" stroke="#A32D2D" stroke-width="0.4" opacity="0.5"/>
<text x="32" y="78" font-family="sans-serif" font-size="9.5" fill="#5E1A1A">Grover-affected primitives:</text>
<text x="40" y="92" font-family="sans-serif" font-size="9" fill="#5E1A1A">• SHA-256 / SHA-3 hashing</text>
<text x="40" y="105" font-family="sans-serif" font-size="9" fill="#5E1A1A">• AES-256 key storage</text>
<text x="32" y="125" font-family="sans-serif" font-size="9.5" fill="#5E1A1A">Rationale (NIST SP 800-57):</text>
<text x="40" y="139" font-family="sans-serif" font-size="9" fill="#5E1A1A">128-bit residual quantum</text>
<text x="40" y="151" font-family="sans-serif" font-size="9" fill="#5E1A1A">security remains acceptable;</text>
<text x="40" y="163" font-family="sans-serif" font-size="9" fill="#5E1A1A">no immediate replacement</text>
<text x="40" y="175" font-family="sans-serif" font-size="9" fill="#5E1A1A">required.</text>
<text x="32" y="195" font-family="sans-serif" font-size="9" font-style="italic" fill="#5E1A1A">Focus: asymmetric ECDLP</text>
<text x="32" y="205" font-family="sans-serif" font-size="9" font-style="italic" fill="#5E1A1A">operations only.</text>

<!-- LEFT: Rejected frameworks -->
<rect x="20" y="222" width="180" height="170" rx="8" fill="#F4ECEC" stroke="#A32D2D" stroke-width="0.6"/>
<text x="110" y="242" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" font-weight="bold" fill="#A32D2D">Frameworks rejected</text>
<line x1="32" y1="254" x2="188" y2="254" stroke="#A32D2D" stroke-width="0.4" opacity="0.5"/>
<text x="32" y="270" font-family="sans-serif" font-size="9.5" fill="#5E1A1A">• CVE / OWASP — focused on</text>
<text x="40" y="282" font-family="sans-serif" font-size="9" fill="#5E1A1A">implementation flaws, not</text>
<text x="40" y="294" font-family="sans-serif" font-size="9" fill="#5E1A1A">structural algorithm failure.</text>
<text x="32" y="312" font-family="sans-serif" font-size="9.5" fill="#5E1A1A">• NIST SP 800-57 — classical</text>
<text x="40" y="324" font-family="sans-serif" font-size="9" fill="#5E1A1A">adversary model.</text>
<text x="32" y="342" font-family="sans-serif" font-size="9.5" fill="#5E1A1A">Adopted: Shostack-style</text>
<text x="32" y="354" font-family="sans-serif" font-size="9.5" fill="#5E1A1A">structured threat modelling</text>
<text x="32" y="366" font-family="sans-serif" font-size="9.5" fill="#5E1A1A">with quantum-specific</text>
<text x="32" y="378" font-family="sans-serif" font-size="9.5" fill="#5E1A1A">vulnerability classification.</text>

<!-- ===================== CENTRE: Four audit stages ===================== -->
<text x="340" y="34" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2C2C2A">Four-stage audit process</text>

<!-- Stage 1 -->
<rect x="220" y="48" width="240" height="64" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.7"/>
<text x="340" y="64" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0F6E56">Stage 1 — Component enumeration</text>
<text x="340" y="80" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#085041">Identify every architectural component of</text>
<text x="340" y="92" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#085041">Fabric v2.5.12 and the cryptographic operations</text>
<text x="340" y="104" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#085041">it performs in the transaction lifecycle.</text>

<!-- arrow -->
<line x1="340" y1="115" x2="340" y2="129" stroke="#444441" stroke-width="1.4" marker-end="url(#arrow_m)"/>

<!-- Stage 2 -->
<rect x="220" y="132" width="240" height="64" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.7"/>
<text x="340" y="148" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0F6E56">Stage 2 — Algorithm and key mapping</text>
<text x="340" y="164" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#085041">Map each operation to its specific algorithm,</text>
<text x="340" y="176" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#085041">key type, key size, and operational context</text>
<text x="340" y="188" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#085041">(signing vs key exchange, long-term vs ephemeral).</text>

<line x1="340" y1="199" x2="340" y2="213" stroke="#444441" stroke-width="1.4" marker-end="url(#arrow_m)"/>

<!-- Stage 3 -->
<rect x="220" y="216" width="240" height="64" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.7"/>
<text x="340" y="232" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0F6E56">Stage 3 — Vulnerability classification</text>
<text x="340" y="248" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#085041">Classify each operation as Shor-threatened</text>
<text x="340" y="260" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#085041">(ECDSA / ECDH P-256) or Grover-affected</text>
<text x="340" y="272" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#085041">(symmetric / hash); exclude the latter from scope.</text>

<line x1="340" y1="283" x2="340" y2="297" stroke="#444441" stroke-width="1.4" marker-end="url(#arrow_m)"/>

<!-- Stage 4 -->
<rect x="220" y="300" width="240" height="64" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.7"/>
<text x="340" y="316" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0F6E56">Stage 4 — Severity &amp; exploitability</text>
<text x="340" y="332" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#085041">Assess each Shor-threatened operation on a</text>
<text x="340" y="344" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#085041">four-level severity scale and a three-level</text>
<text x="340" y="356" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#085041">exploitability scale (see right).</text>

<!-- Outputs box -->
<rect x="220" y="380" width="240" height="56" rx="6" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.6"/>
<text x="340" y="396" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#7A4D0F">Outputs feed forward to</text>
<text x="340" y="412" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#5E3D0C">§4.3 threat model (TS1–TS5) →</text>
<text x="340" y="424" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#5E3D0C">§4.4 risk matrix → §4.5 requirements R1–R8</text>

<!-- ===================== RIGHT: Severity scale ===================== -->
<rect x="480" y="30" width="180" height="362" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.6"/>
<text x="570" y="50" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2C2C2A">Severity scale (Stage 4)</text>
<line x1="492" y1="62" x2="648" y2="62" stroke="#888780" stroke-width="0.4" opacity="0.5"/>

<!-- Critical -->
<rect x="492" y="74" width="14" height="14" rx="3" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="512" y="84" font-family="sans-serif" font-size="10" font-weight="bold" fill="#A32D2D">Critical</text>
<text x="492" y="100" font-family="sans-serif" font-size="9" fill="#5E1A1A">Network-wide integrity or</text>
<text x="492" y="112" font-family="sans-serif" font-size="9" fill="#5E1A1A">authenticity compromise;</text>
<text x="492" y="124" font-family="sans-serif" font-size="9" fill="#5E1A1A">propagates from one</text>
<text x="492" y="136" font-family="sans-serif" font-size="9" fill="#5E1A1A">recovered trust anchor.</text>

<!-- High -->
<rect x="492" y="152" width="14" height="14" rx="3" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="512" y="162" font-family="sans-serif" font-size="10" font-weight="bold" fill="#7A4D0F">High</text>
<text x="492" y="178" font-family="sans-serif" font-size="9" fill="#5E3D0C">Per-identity forgery or</text>
<text x="492" y="190" font-family="sans-serif" font-size="9" fill="#5E3D0C">impersonation within a</text>
<text x="492" y="202" font-family="sans-serif" font-size="9" fill="#5E3D0C">channel; bounded by</text>
<text x="492" y="214" font-family="sans-serif" font-size="9" fill="#5E3D0C">endorsement policy.</text>

<!-- Medium -->
<rect x="492" y="230" width="14" height="14" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="512" y="240" font-family="sans-serif" font-size="10" font-weight="bold" fill="#185FA5">Medium</text>
<text x="492" y="256" font-family="sans-serif" font-size="9" fill="#0C447C">Confidentiality breach</text>
<text x="492" y="268" font-family="sans-serif" font-size="9" fill="#0C447C">via HNDL decryption of</text>
<text x="492" y="280" font-family="sans-serif" font-size="9" fill="#0C447C">recorded TLS or gossip</text>
<text x="492" y="292" font-family="sans-serif" font-size="9" fill="#0C447C">sessions.</text>

<!-- Low -->
<rect x="492" y="308" width="14" height="14" rx="3" fill="#EFEFEC" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="512" y="318" font-family="sans-serif" font-size="10" font-weight="bold" fill="#5F5E5A">Low</text>
<text x="492" y="334" font-family="sans-serif" font-size="9" fill="#3D3D3A">Partial information or</text>
<text x="492" y="346" font-family="sans-serif" font-size="9" fill="#3D3D3A">marginal capability; not</text>
<text x="492" y="358" font-family="sans-serif" font-size="9" fill="#3D3D3A">directly forgery-enabling.</text>
<text x="492" y="374" font-family="sans-serif" font-size="9" font-style="italic" fill="#5F5E5A">(No operation in this audit</text>
<text x="492" y="384" font-family="sans-serif" font-size="9" font-style="italic" fill="#5F5E5A">was rated Low.)</text>

<!-- Footer caption -->
<text x="340" y="448" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#5F5E5A" font-style="italic">Exploitability uses a parallel three-level scale (High / Medium / Low) per §4.4 risk matrix.</text>
</svg>
