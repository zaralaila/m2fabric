<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 382" width="680" height="382">
<title>M²Fabric dual-CA architecture</title>
<desc>Post-quantum CA issues MSP identity certificates. Classical ECDSA CA issues TLS certificates. Routing box dispatches enrolment requests. Bottom panels show certificate types and threat surfaces.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- PQC-CA container -->
<rect x="18" y="12" width="238" height="118" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.7"/>
<text font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#085041" x="137" y="30" text-anchor="middle" dominant-baseline="central">Post-quantum CA  (PQC-CA)</text>
<line x1="28" y1="40" x2="246" y2="40" stroke="#0F6E56" stroke-width="0.5" opacity="0.4"/>
<!-- PQCSigner inner box -->
<rect x="28" y="50" width="100" height="68" rx="5" fill="#C8EFE0" stroke="#0F6E56" stroke-width="0.5"/>
<text font-family="sans-serif" font-size="10" font-weight="bold" fill="#085041" x="78" y="70" text-anchor="middle" dominant-baseline="central">PQCSigner</text>
<text font-family="sans-serif" font-size="9" fill="#0F6E56" x="78" y="88" text-anchor="middle" dominant-baseline="central">crypto.Signer</text>
<text font-family="sans-serif" font-size="9" fill="#0F6E56" x="78" y="104" text-anchor="middle" dominant-baseline="central">interface</text>
<!-- buildPQCCert inner box -->
<rect x="138" y="50" width="108" height="68" rx="5" fill="#C8EFE0" stroke="#0F6E56" stroke-width="0.5"/>
<text font-family="sans-serif" font-size="10" font-weight="bold" fill="#085041" x="192" y="70" text-anchor="middle" dominant-baseline="central">buildPQCCert()</text>
<text font-family="sans-serif" font-size="9" fill="#0F6E56" x="192" y="88" text-anchor="middle" dominant-baseline="central">custom ASN.1</text>
<text font-family="sans-serif" font-size="9" fill="#0F6E56" x="192" y="104" text-anchor="middle" dominant-baseline="central">bypass</text>

<!-- ECDSA-CA container -->
<rect x="424" y="12" width="238" height="118" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.7"/>
<text font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#042C53" x="543" y="30" text-anchor="middle" dominant-baseline="central">Classical CA  (ECDSA-CA)</text>
<line x1="434" y1="40" x2="652" y2="40" stroke="#185FA5" stroke-width="0.5" opacity="0.4"/>
<!-- ECDSA signer inner box -->
<rect x="434" y="50" width="100" height="68" rx="5" fill="#C5D8F0" stroke="#185FA5" stroke-width="0.5"/>
<text font-family="sans-serif" font-size="10" font-weight="bold" fill="#042C53" x="484" y="70" text-anchor="middle" dominant-baseline="central">ECDSA signer</text>
<text font-family="sans-serif" font-size="9" fill="#185FA5" x="484" y="88" text-anchor="middle" dominant-baseline="central">crypto/x509</text>
<text font-family="sans-serif" font-size="9" fill="#185FA5" x="484" y="104" text-anchor="middle" dominant-baseline="central">stdlib</text>
<!-- x509.CreateCertificate inner box -->
<rect x="544" y="50" width="108" height="68" rx="5" fill="#C5D8F0" stroke="#185FA5" stroke-width="0.5"/>
<text font-family="sans-serif" font-size="10" font-weight="bold" fill="#042C53" x="598" y="66" text-anchor="middle" dominant-baseline="central">x509.Create-</text>
<text font-family="sans-serif" font-size="10" font-weight="bold" fill="#042C53" x="598" y="82" text-anchor="middle" dominant-baseline="central">Certificate()</text>
<text font-family="sans-serif" font-size="9" fill="#185FA5" x="598" y="100" text-anchor="middle" dominant-baseline="central">standard Go TLS</text>

<!-- Routing box -->
<rect x="240" y="42" width="200" height="58" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#2C2C2A" x="340" y="62" text-anchor="middle" dominant-baseline="central">Certificate routing</text>
<text font-family="sans-serif" font-size="9" fill="#888780" x="340" y="80" text-anchor="middle" dominant-baseline="central">enrolment request type</text>

<!-- Routing arrows to CAs -->
<line x1="240" y1="71" x2="258" y2="71" stroke="#0F6E56" stroke-width="1.2" marker-end="url(#arrow)"/>
<text font-family="sans-serif" font-size="8.5" font-style="italic" fill="#085041" x="248" y="62" text-anchor="middle" dominant-baseline="central">MSP req.</text>
<line x1="440" y1="71" x2="422" y2="71" stroke="#185FA5" stroke-width="1.2" marker-end="url(#arrow)"/>
<text font-family="sans-serif" font-size="8.5" font-style="italic" fill="#042C53" x="432" y="62" text-anchor="middle" dominant-baseline="central">TLS req.</text>

<!-- Downward arrows: CAs → cert type panels -->
<line x1="137" y1="130" x2="137" y2="218" stroke="#0F6E56" stroke-width="1.2" marker-end="url(#arrow)"/>
<text font-family="sans-serif" font-size="8.5" font-style="italic" fill="#085041" x="148" y="178" dominant-baseline="central">issues</text>
<line x1="543" y1="130" x2="543" y2="218" stroke="#185FA5" stroke-width="1.2" marker-end="url(#arrow)"/>
<text font-family="sans-serif" font-size="8.5" font-style="italic" fill="#042C53" x="554" y="178" dominant-baseline="central">issues</text>

<!-- MSP identity certificates panel -->
<rect x="18" y="220" width="298" height="106" rx="7" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.7"/>
<text font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#085041" x="167" y="238" text-anchor="middle" dominant-baseline="central">MSP identity certificates</text>
<line x1="28" y1="248" x2="306" y2="248" stroke="#0F6E56" stroke-width="0.4" opacity="0.4"/>
<text font-family="sans-serif" font-size="9" fill="#0F6E56" x="167" y="263" text-anchor="middle" dominant-baseline="central">ML-DSA / FN-DSA public key  ·  PQC signed</text>
<text font-family="sans-serif" font-size="9" fill="#0F6E56" x="167" y="279" text-anchor="middle" dominant-baseline="central">Used by: peers, orderers, clients</text>
<text font-family="sans-serif" font-size="9" fill="#888780" x="167" y="295" text-anchor="middle" dominant-baseline="central">Appears in ledger — harvest surface for TS1–TS3</text>
<text font-family="sans-serif" font-size="9" font-weight="bold" fill="#085041" x="167" y="315" text-anchor="middle" dominant-baseline="central">Closes TS1 · TS2 · TS3</text>

<!-- TLS certificates panel -->
<rect x="364" y="220" width="298" height="106" rx="7" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.7"/>
<text font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#042C53" x="513" y="238" text-anchor="middle" dominant-baseline="central">TLS certificates</text>
<line x1="374" y1="248" x2="652" y2="248" stroke="#185FA5" stroke-width="0.4" opacity="0.4"/>
<text font-family="sans-serif" font-size="9" fill="#185FA5" x="513" y="263" text-anchor="middle" dominant-baseline="central">ECDSA P-256 public key  ·  classical signed</text>
<text font-family="sans-serif" font-size="9" fill="#185FA5" x="513" y="279" text-anchor="middle" dominant-baseline="central">Used by: TLS sessions only</text>
<text font-family="sans-serif" font-size="9" fill="#888780" x="513" y="295" text-anchor="middle" dominant-baseline="central">Not committed to ledger  ·  required by Go crypto/tls</text>
<text font-family="sans-serif" font-size="9" font-weight="bold" fill="#042C53" x="513" y="315" text-anchor="middle" dominant-baseline="central">Addresses TS4  ·  via X25519MLKEM768 key exchange</text>

<!-- Future state note -->
<rect x="170" y="340" width="340" height="34" rx="6" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.6"/>
<text font-family="sans-serif" font-size="9" font-weight="bold" fill="#633806" x="340" y="352" text-anchor="middle" dominant-baseline="central">Future state</text>
<text font-family="sans-serif" font-size="8.5" fill="#633806" x="340" y="367" text-anchor="middle" dominant-baseline="central">Unified PQC CA once Go crypto/tls supports post-quantum OIDs</text>
</svg>
